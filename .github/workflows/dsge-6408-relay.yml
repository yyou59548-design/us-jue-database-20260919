name: DSGE 6408 pre-crisis relay

on:
  push:
    paths:
      - ".github/workflows/dsge-6408-relay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download pre-crisis posterior files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p relay6408
          base="https://gregorboehl.com/data"
          for f in \
            rank_spreads_exo_ztrend_SW_BAA_6408_ninit_0_meta.npz \
            rank_spreads_exo_ztrend_SW_BAA_6408_ninit_0_res.npz
          do
            curl --fail --location --retry 8 --retry-all-errors --retry-delay 2 \
              --connect-timeout 20 --max-time 900 \
              --user-agent "Mozilla/5.0 GitHub-Actions-DSGE-Relay" \
              "$base/$f" -o "relay6408/$f"
          done
          sha256sum relay6408/*.npz | tee relay6408/SHA256SUMS.txt
          ls -lh relay6408

      - name: Validate archives
        shell: python
        run: |
          import pathlib, zipfile, hashlib, json
          out={}
          for p in pathlib.Path("relay6408").glob("*.npz"):
              with zipfile.ZipFile(p) as z:
                  bad=z.testzip()
                  if bad:
                      raise RuntimeError(f"{p.name}: corrupt member {bad}")
                  entries=z.namelist()
              out[p.name]={"bytes":p.stat().st_size,
                           "sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
                           "zip_entries":entries}
          pathlib.Path("relay6408/MANIFEST.json").write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsge-6408-relay
          path: relay6408/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
