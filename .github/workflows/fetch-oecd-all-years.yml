name: Fetch OECD CRDF official all-year workbook
on:
  push:
    branches: [oecd-raw-data-20261017]
    paths: ['.github/workflows/fetch-oecd-all-years.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify OECD official consolidated 2000-2024 workbook
        shell: bash
        run: |
          python - <<'PY'
          import pathlib,urllib.request,hashlib,json,zipfile,sys
          out=pathlib.Path('official');out.mkdir(exist_ok=True)
          url='https://webfs.oecd.org/climate/RecipientPerspective/CRDF-RP_all_years_2000-2024.xlsx'
          dest=out/'CRDF-RP_all_years_2000-2024.xlsx'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 OECD academic CRDF verification'})
          try:
            with urllib.request.urlopen(req,timeout=180) as resp, dest.open('wb') as f:
              while True:
                part=resp.read(8*1024*1024)
                if not part: break
                f.write(part)
            size=dest.stat().st_size
            if size!=70538788: raise ValueError('Official directory size differs: '+str(size))
            with zipfile.ZipFile(dest) as z:
              bad=z.testzip()
              if bad: raise ValueError('CRC error: '+str(bad))
              names=z.namelist()
              if 'xl/workbook.xml' not in names:raise ValueError('Missing xl/workbook.xml')
              sheets=sum(n.startswith('xl/worksheets/sheet') and n.endswith('.xml') for n in names)
            data=dest.read_bytes()
            record={'source_url':url,'source_type':'OECD_OFFICIAL','file_name':dest.name,
              'bytes':size,'sha256':hashlib.sha256(data).hexdigest(),
              'git_blob_sha1':hashlib.sha1(b'blob '+str(size).encode()+bytes([0])+data).hexdigest(),
              'worksheet_xml_count':sheets,'xlsx_zip_crc_pass':True}
            (out/'MANIFEST_FULL.json').write_text(json.dumps(record,indent=2))
            print(json.dumps(record))
          except Exception as exc:
            (out/'ERROR.txt').write_text(repr(exc))
            print('DOWNLOAD_FAILED',repr(exc));sys.exit(1)
          PY
      - name: Upload official full-history workbook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oecd-crdf-rp-2000-2024-official
          path: official/
          retention-days: 20
          if-no-files-found: error
