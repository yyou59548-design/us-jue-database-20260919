name: IDA20 V18 public financing evidence
on:
  push:
    branches: [oecd-raw-data-20261017]
    paths: ['.github/workflows/ida20-v18-financing-evidence.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch documented public API with bounded pagination
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,pathlib,hashlib,gzip,datetime,concurrent.futures
          out=pathlib.Path('evidence');out.mkdir(exist_ok=True)
          base='https://datacatalogapi.worldbank.org/dexapps/fone/api/apiservice'
          specs=[('latest','DS00001','RS00001',None),('2020-06','DS00976','RS00906','30-Jun-2020'),('2022-06','DS00976','RS00906','30-Jun-2022'),('2024-06','DS00976','RS00906','30-Jun-2024')]
          def collect(spec):
            name,ds,rs,snap=spec
            log={'name':name,'datasetId':ds,'resourceId':rs,'snapshot':snap,'status':'INCOMPLETE','pages':[],'rows':0,'started_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
            seen=set();fingerprints=set();records=[]
            try:
              for page in range(40):
                params={'datasetId':ds,'resourceId':rs,'top':1000,'type':'json','skip':1000*page}
                if snap:params['end_of_period']=snap
                url=base+'?'+urllib.parse.urlencode(params)
                with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Academic IDA20 evidence verification'}),timeout=80) as resp: raw=resp.read()
                (out/f'{name}_page_{page:03}.json.gz').write_bytes(gzip.compress(raw,mtime=0))
                obj=json.loads(raw)
                if not isinstance(obj,dict) or not isinstance(obj.get('data'),list):raise ValueError('Unexpected schema: '+str(obj)[:500])
                rows=obj['data'];digest=hashlib.sha256(raw).hexdigest()
                log['pages'].append({'url':url,'rows':len(rows),'sha256':digest,'count':obj.get('count'),'root_keys':list(obj)})
                if rows and digest in fingerprints:raise ValueError('Repeated response page')
                fingerprints.add(digest)
                for r in rows:
                  if not isinstance(r,dict):raise ValueError('Row not object')
                  if not all(k in r for k in ('credit_number','end_of_period','project_id','board_approval_date')):raise ValueError('Missing identifier columns: '+str(list(r)))
                  if snap:
                    target=datetime.datetime.strptime(snap,'%d-%b-%Y').date()
                    text=str(r['end_of_period']);got=None
                    for fmt in ('%d-%b-%Y','%Y-%m-%d','%Y-%m-%dT%H:%M:%S','%Y-%m-%dT%H:%M:%S.%f','%m/%d/%Y'):
                      try:got=datetime.datetime.strptime(text.rstrip('Z'),fmt).date();break
                      except ValueError:pass
                    if got!=target:raise ValueError('Snapshot filter mismatch '+text)
                  key=(r['credit_number'],r['end_of_period'])
                  if key in seen:raise ValueError('Repeated credit-snapshot key '+str(key))
                  seen.add(key);records.append(r)
                log['rows']=len(records)
                (out/f'{name}_manifest.json').write_text(json.dumps(log,indent=2))
                print(name,'page',page,'rows',len(rows),flush=True)
                if len(rows)<1000:
                  log['status']='PAGINATION_COMPLETE_REQUIRES_LOCAL_VALIDATION';break
              else:raise ValueError('Page limit reached')
            except Exception as e:log['status']='FAILED_NOT_COMPLETE';log['error']=repr(e)
            (out/f'{name}_records.json.gz').write_bytes(gzip.compress(json.dumps(records).encode(),mtime=0))
            (out/f'{name}_manifest.json').write_text(json.dumps(log,indent=2))
            print(json.dumps(log),flush=True)
            return log
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool: logs=list(pool.map(collect,specs))
          (out/'RUN_SUMMARY.json').write_text(json.dumps(logs,indent=2))
          PY
      - name: Upload actual responses and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ida20-v18-financing-evidence
          path: evidence/
          retention-days: 20
          if-no-files-found: error
