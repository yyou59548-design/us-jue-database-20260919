name: IDA20 V18 historical policy documents
on:
  push:
    branches: [oecd-raw-data-20261017]
    paths: ['.github/workflows/ida20-v18-policy-sources.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download public source files and inspect public interface links
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,pathlib,json,hashlib,re,concurrent.futures
          from html.parser import HTMLParser
          out=pathlib.Path('policy');out.mkdir(exist_ok=True)
          sources={
          'allocation_FY20.xlsx':'https://thedocs.worldbank.org/en/doc/b91beb1edc55dd5b0471121f022643bc-0410012021/original/ida_country_allocations_in_fy20.xlsx',
          'allocation_FY21.xlsx':'https://thedocs.worldbank.org/en/doc/d48fe70bb197caf2d22ca610f84c2421-0410012021/original/FY21-IDA-Country-Allocations-Key-Input-Data-for-FY21.xlsx',
          'allocation_FY22.xlsx':'https://thedocs.worldbank.org/en/doc/cd728900972755c96ff58762fafd8e7f-0410012022/original/FY22-Table-1-and-Table-2.xlsx',
          'terms_2020_07.pdf':'https://thedocs.worldbank.org/en/doc/ee9051374ce4396063ce000e82983325-0410012020/original/ida-terms-effective-july-1-2020.pdf',
          'terms_2021_01.pdf':'https://thedocs.worldbank.org/en/doc/a8d221c20633b4d91a96ed2c7b361aff-0410012020/original/ida_terms_effective_1.1.2021.pdf',
          'IDA20_factsheet_2022_06.pdf':'https://thedocs.worldbank.org/en/doc/3c0a66c3ec91a88cb97f69a2edd75768-0410012022/original/1Fact-Sheet-IDA20-Building-Back-Better-From-The-Crisis-2022-6.pdf',
          'financial_documents.html':'https://ida.worldbank.org/en/financing/ida-financial-documents',
          'api_explorer.html':'https://financesone.worldbank.org/api-explorer?id=DS00976',
          'country_uganda.html':'https://ida.worldbank.org/en/financing/debt/country/uganda',
          'SDFP_FY21_chapter4.html':'https://ieg.worldbankgroup.org/evaluations/international-development-associations-sustainable-development-finance-policy/chapter-4'}
          logs=[]
          def fetch(pair):
            name,url=pair
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Public academic source archive'})
              with urllib.request.urlopen(req,timeout=90) as resp:data=resp.read();ct=resp.headers.get('Content-Type');final=resp.url
              (out/name).write_bytes(data)
              rec={'name':name,'url':url,'final_url':final,'content_type':ct,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'status':'DOWNLOADED'}
            except Exception as e:rec={'name':name,'url':url,'status':'FAILED','error':repr(e)}
            print(json.dumps(rec),flush=True);return rec
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as p:logs.extend(p.map(fetch,sources.items()))
          class P(HTMLParser):
            def __init__(self):super().__init__();self.links=[];self.scripts=[];self.current=None
            def handle_starttag(self,t,a):
              d=dict(a)
              if t=='a' and d.get('href'):self.current={'href':d['href'],'text':''};self.links.append(self.current)
              if t=='script' and d.get('src'):self.scripts.append(d['src'])
            def handle_data(self,d):
              if self.current:self.current['text']+=d
            def handle_endtag(self,t):
              if t=='a':self.current=None
          extras=[];inventories={}
          for name,url in sources.items():
            if not name.endswith('.html') or not (out/name).exists():continue
            parser=P();parser.feed((out/name).read_text(errors='replace'));inventories[name]={'links':parser.links,'scripts':parser.scripts}
            for i,l in enumerate(parser.links):
              h=urllib.parse.urljoin(url,l['href']);txt=l['text'].strip()
              if name=='financial_documents.html' and re.search(r'(FY18|Windows|FY21|FY20)',txt,re.I) and re.search(r'\.xlsx?(?:\?|$)',h,re.I):extras.append((f'linked_{name}_{i}.xlsx',h))
              if name=='SDFP_FY21_chapter4.html' and '.pdf' in h:extras.append((f'linked_SDFP_{i}.pdf',h))
            if name=='api_explorer.html':
              for i,h in enumerate(parser.scripts[:30]):extras.append((f'api_js_{i:02}.js',urllib.parse.urljoin(url,h)))
          (out/'LINK_INVENTORY.json').write_text(json.dumps(inventories,indent=2))
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as p:logs.extend(p.map(fetch,extras))
          (out/'SOURCE_MANIFEST.json').write_text(json.dumps(logs,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ida20-v18-policy-sources
          path: policy/
          retention-days: 20
          if-no-files-found: error
