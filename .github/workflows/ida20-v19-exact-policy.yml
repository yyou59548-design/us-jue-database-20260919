name: IDA20 V19 exact policy verification
on:
  push:
    branches: [oecd-raw-data-20261017]
    paths: ['.github/workflows/ida20-v19-exact-policy.yml']
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Archive historical public documents and validate exact document identity
        run: |
          python - <<'PY'
          import urllib.request,json,pathlib,hashlib
          out=pathlib.Path('policy');out.mkdir(exist_ok=True);logs=[]
          targets={
          'terms2022.pdf':'https://thedocs.worldbank.org/en/doc/4ba0d9ce635798556c81a6db4d9aa4a8-0410012022/original/IDA-Terms-effective-7-1-2022.pdf',
          'terms2024.pdf':'https://thedocs.worldbank.org/en/doc/b285e2c17251b3b4486644f879148983-0410012024/related/IDA-Terms-effective-07-01-2024.pdf',
          'terms2020.pdf':'https://thedocs.worldbank.org/en/doc/ee9051374ce4396063ce000e82983325-0410012020/original/ida-terms-effective-july-1-2020.pdf',
          'FY25_exact_metadata.json':'https://search.worldbank.org/api/v2/wds?format=json&id=099121925154535548&fl=docdt,display_title,pdfurl,txturl,url',
          'FY25_exact_keyword_metadata.json':'https://search.worldbank.org/api/v2/wds?format=json&qterm=099121925154535548&rows=10&fl=docdt,display_title,pdfurl,txturl,url'
          }
          def get(name,url):
            log={'file':name,'url':url}
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 research source verification'}),timeout=60) as r:b=r.read()
              if name.endswith('.pdf') and not b.startswith(b'%PDF'):raise ValueError('Invalid PDF')
              if name.endswith('.json'):json.loads(b)
              (out/name).write_bytes(b);log.update(status='DOWNLOADED',bytes=len(b),sha256=hashlib.sha256(b).hexdigest());return b
            except Exception as e:log.update(status='FAILED',error=repr(e));return None
            finally:logs.append(log)
          for name,url in targets.items():get(name,url)
          for name in ('FY25_exact_metadata.json','FY25_exact_keyword_metadata.json'):
            p=out/name
            if not p.exists():continue
            docs=json.loads(p.read_text()).get('documents',{})
            for k,r in docs.items():
              if not isinstance(r,dict):continue
              title=str(r.get('display_title',''))
              url=r.get('pdfurl','')
              if 'IDA Country Allocations for FY25' in title and '/099121925154535548/' in url:
                get('FY25_ALLOCATIONS_EXACT.pdf',url)
          (out/'MANIFEST.json').write_text(json.dumps(logs,indent=2));print(json.dumps(logs))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ida20-v19-exact-policy
          path: policy/
          retention-days: 20
